<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Сердце Памяти</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
background:radial-gradient(120% 70% at 50% -10%,rgba(212,175,55,.08),transparent 60%),#08070a;
color:#ece8e1;font-family:'Inter',sans-serif;padding:24px}
.heart{font-size:74px;filter:drop-shadow(0 0 22px rgba(212,175,55,.55));animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.09)}}
h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,6vw,52px);margin:20px 0 12px;letter-spacing:.5px}
h1 em{font-style:normal;color:#d4af37}
p{color:#8d877c;font-size:15px;line-height:1.7;max-width:420px}
.line{width:60px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:22px auto}
.foot{position:fixed;bottom:18px;color:#4a463f;font-size:11px;letter-spacing:1px}
</style>
</head>
<body>
<div class="heart">❤️</div>
<h1>Сердце <em>Памяти</em></h1>
<div class="line"></div>
<p>Сайт в разработке. Скоро мы откроем двери для всех — спасибо, что вы с нами.</p>
<div class="foot">© 2026 Сердце Памяти</div>
</body>
</html>
